# QA rebuild requested 2026-08-06; app source unchanged.
name: Build iPhone QA App

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Choose the Apple artifact to build
        required: true
        default: simulator
        type: choice
        options:
          - simulator
          - signed_ipa
  push:
    branches:
      - main
    paths:
      - SNAP-EBT-Grocery-Tracker-iOS-QA-Source-v1.0.0.zip
      - SOURCE_SHA256.txt
      - .github/workflows/build-ios-qa.yml

permissions:
  contents: read

concurrency:
  group: ios-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  BUILD_TARGET: ${{ inputs.build_target || 'simulator' }}
  EXPO_PUBLIC_BUILD_PROFILE: qa
  EXPO_PUBLIC_QA_PURCHASES: "1"
  APP_DIRECTORY: app-source/grocery-benefits-tracker
  BUNDLE_IDENTIFIER: com.goodusestudios.snapebtgrocerytracker.qa
  SCHEME: SNAPEBTGroceryTrackerQA

jobs:
  build-ios-qa:
    name: Validate and build iOS QA artifact
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify and extract the preserved source
        shell: bash
        run: |
          shasum -a 256 -c SOURCE_SHA256.txt
          mkdir -p app-source
          ditto -x -k SNAP-EBT-Grocery-Tracker-iOS-QA-Source-v1.0.0.zip app-source
          test -f "$APP_DIRECTORY/ios/$SCHEME.xcodeproj/project.pbxproj"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app-source/grocery-benefits-tracker/package-lock.json

      - name: Record Apple toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - name: Install exact JavaScript dependencies
        working-directory: app-source/grocery-benefits-tracker
        run: npm ci --no-audit --no-fund

      - name: Run iOS QA validation
        working-directory: app-source/grocery-benefits-tracker
        shell: bash
        run: |
          npm run typecheck
          npm run test:logic
          npm run test:ui
          npm run verify:package
          node "$GITHUB_WORKSPACE/scripts/verify-ios-archive.mjs"

      - name: Install native iOS dependencies
        working-directory: app-source/grocery-benefits-tracker/ios
        shell: bash
        run: pod install --repo-update

      - name: Build Simulator application
        if: ${{ env.BUILD_TARGET == 'simulator' }}
        working-directory: app-source/grocery-benefits-tracker
        shell: bash
        run: |
          set -o pipefail
          derived_data="$RUNNER_TEMP/DerivedData-simulator"
          xcodebuild \
            -workspace "ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | tee "$RUNNER_TEMP/xcodebuild-simulator.log"

          app_path="$derived_data/Build/Products/Release-iphonesimulator/$SCHEME.app"
          test -d "$app_path"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0-Simulator.app.zip"
          shasum -a 256 "artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0-Simulator.app.zip" \
            > "artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0-Simulator.app.zip.sha256"

      - name: Confirm encrypted Apple signing inputs
        if: ${{ env.BUILD_TARGET == 'signed_ipa' }}
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          missing=()
          [[ -n "$IOS_P12_BASE64" ]] || missing+=(IOS_P12_BASE64)
          [[ -n "$IOS_P12_PASSWORD" ]] || missing+=(IOS_P12_PASSWORD)
          [[ -n "$IOS_MOBILEPROVISION_BASE64" ]] || missing+=(IOS_MOBILEPROVISION_BASE64)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing repository secrets: ${missing[*]}" >&2
            echo "Read IOS_SIGNING_SETUP.md, add the three encrypted secrets, and rerun signed_ipa." >&2
            exit 1
          fi

      - name: Build, sign, export, and verify iPhone IPA
        if: ${{ env.BUILD_TARGET == 'signed_ipa' }}
        working-directory: app-source/grocery-benefits-tracker
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/qa-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/qa-signing.p12"
          profile_path="$RUNNER_TEMP/qa.mobileprovision"
          profile_plist="$RUNNER_TEMP/qa-profile.plist"
          archive_path="$RUNNER_TEMP/SNAP-EBT-Grocery-Tracker-QA.xcarchive"
          export_path="$RUNNER_TEMP/ipa-export"
          installed_profile=""

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            [[ -z "$installed_profile" ]] || rm -f "$installed_profile"
            rm -f "$p12_path" "$profile_path" "$profile_plist"
          }
          trap cleanup EXIT

          printf '%s' "$IOS_P12_BASE64" | base64 -D > "$p12_path"
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_bundle_identifier="${application_identifier#*.}"

          if [[ "$profile_bundle_identifier" != "$BUNDLE_IDENTIFIER" ]]; then
            echo "Provisioning profile bundle ID is $profile_bundle_identifier; expected $BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
            echo "The provisioning profile is not an Ad Hoc profile containing registered iPhone devices." >&2
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_profile"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" \
            -P "$IOS_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(.*\)".*/\1/p' \
            | head -n 1)"
          case "$signing_identity" in
            "Apple Distribution:"*|"iPhone Distribution:"*) ;;
            *)
              echo "The P12 must contain an Apple Distribution certificate and its private key." >&2
              exit 1
              ;;
          esac

          set -o pipefail
          xcodebuild \
            -workspace "ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$team_id" \
            CODE_SIGN_IDENTITY="$signing_identity" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $keychain_path" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

          export_method=ad-hoc
          if xcodebuild -help 2>&1 | grep -q 'release-testing'; then
            export_method=release-testing
          fi
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c "Add :method string $export_method" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $team_id" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_IDENTIFIER string $profile_name" "$export_options"

          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            | tee "$RUNNER_TEMP/xcodebuild-export.log"

          exported_ipa="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$exported_ipa"
          mkdir -p artifacts "$RUNNER_TEMP/ipa-verify"
          cp "$exported_ipa" "artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0.ipa"
          ditto -x -k "artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0.ipa" "$RUNNER_TEMP/ipa-verify"
          signed_app="$RUNNER_TEMP/ipa-verify/Payload/$SCHEME.app"
          test -d "$signed_app"
          codesign --verify --deep --strict --verbose=2 "$signed_app"
          installed_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$signed_app/Info.plist")"
          [[ "$installed_bundle_id" == "$BUNDLE_IDENTIFIER" ]]
          test -f "$signed_app/embedded.mobileprovision"
          shasum -a 256 "artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0.ipa" \
            > "artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0.ipa.sha256"

      - name: Upload Simulator application
        if: ${{ env.BUILD_TARGET == 'simulator' }}
        uses: actions/upload-artifact@v7
        with:
          path: app-source/grocery-benefits-tracker/artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0-Simulator.app.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Simulator checksum
        if: ${{ env.BUILD_TARGET == 'simulator' }}
        uses: actions/upload-artifact@v7
        with:
          path: app-source/grocery-benefits-tracker/artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0-Simulator.app.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed iPhone IPA
        if: ${{ env.BUILD_TARGET == 'signed_ipa' }}
        uses: actions/upload-artifact@v7
        with:
          path: app-source/grocery-benefits-tracker/artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0.ipa
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPA checksum
        if: ${{ env.BUILD_TARGET == 'signed_ipa' }}
        uses: actions/upload-artifact@v7
        with:
          path: app-source/grocery-benefits-tracker/artifacts/SNAP-EBT-Grocery-Tracker-QA-v1.0.0.ipa.sha256
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add build result note
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "$BUILD_TARGET" == "signed_ipa" ]]; then
            {
              echo "## iPhone QA IPA"
              echo
              echo "A successful run provides **SNAP-EBT-Grocery-Tracker-QA-v1.0.0.ipa** in Artifacts."
              echo "It is valid only for iPhones included in the Ad Hoc provisioning profile."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## iOS Simulator QA build"
              echo
              echo "This compile check is not installable on a physical iPhone."
              echo "For a registered iPhone, add the signing secrets and run **signed_ipa**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

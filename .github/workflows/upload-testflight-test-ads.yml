name: Upload TestFlight internal build with test ads

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD TEST ADS to confirm this is an internal-only build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-internal-upload
  cancel-in-progress: false

env:
  CI: "1"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_AD_PROFILE: test
  EXPO_PUBLIC_IOS_ADMOB_BANNER_ID: ""
  SOURCE_ZIP: SNAP-EBT-Grocery-Tracker-iOS-QA-Source-v1.0.0.zip
  SOURCE_ZIP_SHA256: bd703ca9474667fd46d833f4025bf396e6489ff275f2819213d708320cce2677
  SCHEME: SNAPEBTGroceryTrackerQA
  IOS_BUNDLE_ID: com.lateefrazaqoyetola.snapebtwictracker
  APP_STORE_ID: "6799562282"
  APPLE_TEAM_ID: 49SQ3XQ68Q
  MARKETING_VERSION: "1.0"
  GOOGLE_TEST_APP_ID: ca-app-pub-3940256099942544~1458002511
  GOOGLE_TEST_BANNER_ID: ca-app-pub-3940256099942544/2934735716

jobs:
  upload:
    name: Signed iPhone build to internal TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    environment: app-store-internal

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Confirm permanent internal-only test build
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "UPLOAD TEST ADS" ]]; then
            echo "Confirmation did not match UPLOAD TEST ADS." >&2
            exit 1
          fi
          [[ "$IOS_BUNDLE_ID" == "com.lateefrazaqoyetola.snapebtwictracker" ]]
          [[ "$IOS_BUNDLE_ID" != *.qa ]]
          [[ "$APP_STORE_ID" == "6799562282" ]]
          [[ "$APPLE_TEAM_ID" == "49SQ3XQ68Q" ]]
          [[ "$MARKETING_VERSION" == "1.0" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          if [[ ! -s release-overlay/ios/Podfile.lock ]]; then
            echo "Reviewed CocoaPods lock is missing. Run the validation workflow, review its ios-pod-lock artifact, and commit that exact lock before uploading." >&2
            exit 1
          fi

      - name: Verify Apple credentials, app record, and unused build number
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing app-store-internal environment secrets: ${missing[*]}" >&2
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          cleanup() {
            rm -f "$key_path"
          }
          trap cleanup EXIT

          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          unset ASC_PRIVATE_KEY
          chmod 600 "$key_path"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$key_path"
          grep -Fq -- '-----END PRIVATE KEY-----' "$key_path"

          jwt="$(ruby release-overlay/scripts/app-store-connect-jwt.rb \
            "$key_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          authorization="Authorization: Bearer $jwt"

          app_response="$RUNNER_TEMP/app-store-app.json"
          bundle_response="$RUNNER_TEMP/app-store-bundle-id.json"
          prerelease_response="$RUNNER_TEMP/app-store-prerelease.json"
          build_page="$RUNNER_TEMP/app-store-build-page.json"
          build_versions="$RUNNER_TEMP/app-store-build-versions.txt"

          curl --fail-with-body --silent --show-error \
            -H "$authorization" \
            "https://api.appstoreconnect.apple.com/v1/apps/$APP_STORE_ID" \
            -o "$app_response"
          ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Unexpected App Store app ID." unless data.fetch("id") == ENV.fetch("APP_STORE_ID")
            actual = data.fetch("attributes").fetch("bundleId")
            abort "App Store bundle ID mismatch: #{actual}" unless actual == ENV.fetch("IOS_BUNDLE_ID")
          ' "$app_response"

          curl --fail-with-body --silent --show-error --get \
            -H "$authorization" \
            --data-urlencode "filter[identifier]=$IOS_BUNDLE_ID" \
            --data-urlencode 'limit=1' \
            'https://api.appstoreconnect.apple.com/v1/bundleIds' \
            -o "$bundle_response"
          ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "The API key cannot access the registered bundle ID." if data.empty?
            actual = data.first.fetch("attributes").fetch("identifier")
            abort "Registered bundle ID mismatch: #{actual}" unless actual == ENV.fetch("IOS_BUNDLE_ID")
          ' "$bundle_response"

          curl --fail-with-body --silent --show-error --get \
            -H "$authorization" \
            --data-urlencode "filter[app]=$APP_STORE_ID" \
            --data-urlencode "filter[version]=$MARKETING_VERSION" \
            --data-urlencode 'filter[platform]=IOS' \
            --data-urlencode 'limit=1' \
            'https://api.appstoreconnect.apple.com/v1/preReleaseVersions' \
            -o "$prerelease_response"

          prerelease_id="$(ruby -rjson -e '
            data = JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Multiple prerelease records unexpectedly matched." if data.length > 1
            puts(data.empty? ? "" : data.first.fetch("id"))
          ' "$prerelease_response")"

          : > "$build_versions"
          if [[ -n "$prerelease_id" ]]; then
            build_url="https://api.appstoreconnect.apple.com/v1/builds"
            first_page=1
            while [[ -n "$build_url" ]]; do
              if (( first_page )); then
                curl --fail-with-body --silent --show-error --get \
                  -H "$authorization" \
                  --data-urlencode "filter[preReleaseVersion]=$prerelease_id" \
                  --data-urlencode 'limit=200' \
                  "$build_url" -o "$build_page"
                first_page=0
              else
                curl --fail-with-body --silent --show-error \
                  -H "$authorization" "$build_url" -o "$build_page"
              fi
              ruby -rjson -e '
                JSON.parse(File.read(ARGV[0])).fetch("data").each do |build|
                  puts build.fetch("attributes").fetch("version")
                end
              ' "$build_page" >> "$build_versions"
              build_url="$(ruby -rjson -e '
                puts JSON.parse(File.read(ARGV[0])).fetch("links").fetch("next", "").to_s
              ' "$build_page")"
            done
          fi

          build_number="$(ruby -e '
            versions = File.readlines(ARGV[0], chomp: true).reject(&:empty?)
            parse = lambda do |value|
              abort "Invalid existing App Store build number: #{value}" unless value.match?(/\A[1-9][0-9]{0,3}(?:\.[0-9]{1,2}){0,2}\z/)
              value.split(".").map(&:to_i)
            end
            if versions.empty?
              puts "1"
              exit
            end
            latest = versions.max_by { |value| parse.call(value) + [0] * (3 - parse.call(value).length) }
            parts = parse.call(latest)
            case parts.length
            when 1
              parts[0] += 1
            when 2
              if parts[1] < 99
                parts[1] += 1
              else
                parts = [parts[0] + 1]
              end
            when 3
              if parts[2] < 99
                parts[2] += 1
              elsif parts[1] < 99
                parts = [parts[0], parts[1] + 1]
              else
                parts = [parts[0] + 1]
              end
            end
            abort "No valid higher Apple build number remains." if parts[0] > 9999
            puts parts.join(".")
          ' "$build_versions")"
          [[ "$build_number" =~ ^[1-9][0-9]{0,3}(\.[0-9]{1,2}){0,2}$ ]]
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          unset jwt authorization
          echo "App Store identity and bundle registration verified; next build is $build_number."

      - name: Assemble and configure the reviewed application
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(shasum -a 256 "$SOURCE_ZIP" | awk '{print $1}')"
          if [[ "$actual_sha" != "$SOURCE_ZIP_SHA256" ]]; then
            echo "Frozen native source archive digest mismatch." >&2
            exit 1
          fi

          archive_listing="$RUNNER_TEMP/frozen-source-entries.txt"
          unzip -Z1 "$SOURCE_ZIP" > "$archive_listing"
          if [[ ! -s "$archive_listing" ]]; then
            echo "Frozen source archive is empty." >&2
            exit 1
          fi
          if LC_ALL=C grep -Eq '^/|(^|/)\.\.(/|$)' "$archive_listing"; then
            echo "Frozen source archive contains an unsafe path." >&2
            exit 1
          fi
          unexpected_entries="$(LC_ALL=C grep -Ev '^grocery-benefits-tracker(/|$)' "$archive_listing" || true)"
          if [[ -n "$unexpected_entries" ]]; then
            echo "Frozen source archive contains an unexpected top-level entry:" >&2
            printf '%s\n' "$unexpected_entries" >&2
            exit 1
          fi
          if LC_ALL=C grep -Eq '(^|/)(__MACOSX|\.DS_Store|\._[^/]*)(/|$)|\.svg$' "$archive_listing"; then
            echo "Frozen source archive contains stale SVG or macOS metadata." >&2
            exit 1
          fi

          extraction_root="$RUNNER_TEMP/latest-ios-source"
          mkdir -p "$extraction_root"
          /usr/bin/ditto -x -k "$SOURCE_ZIP" "$extraction_root"
          app_root="$extraction_root/grocery-benefits-tracker"
          test -f "$app_root/ios/$SCHEME.xcodeproj/project.pbxproj"

          archive_symlink="$(find "$app_root" -type l -print -quit)"
          if [[ -n "$archive_symlink" ]]; then
            echo "Frozen source archive contains a symbolic link: $archive_symlink" >&2
            exit 1
          fi

          while IFS=' ' read -r expected_sha relative_path; do
            asset_path="$app_root/$relative_path"
            if [[ ! -f "$asset_path" ]]; then
              echo "Frozen source asset is missing: $relative_path" >&2
              exit 1
            fi
            asset_sha="$(shasum -a 256 "$asset_path" | awk '{print $1}')"
            if [[ "$asset_sha" != "$expected_sha" ]]; then
              echo "Frozen source asset digest mismatch: $relative_path ($asset_sha)" >&2
              exit 1
            fi
          done <<'ARCHIVE_ASSET_HASHES'
          9b3898e0fcb36e5b809106ad445b0c6df2743df5486400c23f837687aa811791 App.tsx
          4396656534aa5d171838c4d71d5f8f0c9e8e5d30cb8889d50fa50c0ce428e0cc app.html
          c050d626db04b28e8c43601f009ffe68fb8f7672445ba2976546575b6df02932 app.json
          5adcbe88c2472c9596f64c4e1413b8976fbbc4337b518eda7632e1e997e34759 app.config.js
          4c3d644cb0c21d2ee9e058f584e745bd758bc15ee819fc5eb0f6fa68b893f102 package.json
          dfd6cc7b6a1c61ef7a8a4409a2ab0d72d1dbd1dd3645361ba2081dc9c1215d92 package-lock.json
          1caed274e2ab10a840cb3dd4ad4fb0bfe73e2b97b57fcd39c2a90cfa83822863 scripts/verify-test-release.mjs
          7d7f7b4567e0d07f5d7c658fec0dc07693263871ba7297eb80c80c85489ff781 src/appHtml.ts
          f1290c34477ea540105bc74c14b0c2c1c0330bd6355c375c87d86c897df2b628 assets/icon.png
          188cf8deaa47857bc1fe1d329c05f1a7f0f9bd1a30ecf5d639ff58216ff26849 assets/splash-icon.png
          bc03268f8abb73de2d51ce85310d7b1a0f990fd3bf8a37ee16418cd4cfee8fa1 assets/splash-ios-icon.png
          188cf8deaa47857bc1fe1d329c05f1a7f0f9bd1a30ecf5d639ff58216ff26849 assets/android-splash-icon.png
          188cf8deaa47857bc1fe1d329c05f1a7f0f9bd1a30ecf5d639ff58216ff26849 assets/android-icon-foreground.png
          09256eb0001160ddca8d7c70c5dc106ce841de6c7798af01a839e80274e6cb05 assets/android-icon-monochrome.png
          f1290c34477ea540105bc74c14b0c2c1c0330bd6355c375c87d86c897df2b628 ios/SNAPEBTGroceryTrackerQA/Images.xcassets/AppIcon.appiconset/App-Icon-1024x1024@1x.png
          bc03268f8abb73de2d51ce85310d7b1a0f990fd3bf8a37ee16418cd4cfee8fa1 ios/SNAPEBTGroceryTrackerQA/Images.xcassets/SplashScreenLogo.imageset/image.png
          1fb439ed990f02073b677b8fed237b1b709ca8e19ff678d2c286a0b065ad2b8c ios/SNAPEBTGroceryTrackerQA/Images.xcassets/SplashScreenLogo.imageset/image@2x.png
          d95f8bb0941cbf93048fdf27df6eaab28a68476da59340c231f519a8a17ef191 ios/SNAPEBTGroceryTrackerQA/Images.xcassets/SplashScreenLogo.imageset/image@3x.png
          adfb1fc681404741510a682544c14442e903df471fac775c7ec30086053c035d ios/SNAPEBTGroceryTrackerQA/Images.xcassets/SplashScreenBackground.colorset/Contents.json
          ARCHIVE_ASSET_HASHES

          if grep -Fq 'BasketIcon' "$app_root/App.tsx" || grep -Fq '🧺' "$app_root/App.tsx"; then
            echo "Frozen direct-build source contains the retired generic basket brand path." >&2
            exit 1
          fi
          grep -Fq 'import APP_HTML from "./src/appHtml";' "$app_root/App.tsx"
          grep -Fq 'Platform.OS === "android"' "$app_root/App.tsx"

          APP_CONFIG_PATH="$app_root/app.json" node <<'NODE'
          const fs = require("node:fs");
          const expo = JSON.parse(fs.readFileSync(process.env.APP_CONFIG_PATH, "utf8")).expo;
          const invariant = (condition, message) => {
            if (!condition) throw new Error(`Frozen app.json brand gate: ${message}`);
          };
          invariant(expo.icon === "./assets/icon.png", "top-level icon path changed");
          invariant(expo.ios?.icon === "./assets/icon.png", "iOS icon path changed");
          invariant(expo.android?.icon === "./assets/icon.png", "Android legacy icon path changed");
          invariant(expo.backgroundColor === "#E0EEFD", "background color changed");
          invariant(expo.primaryColor === "#005BB5", "primary color changed");
          const plugins = (expo.plugins || []).map((entry) => Array.isArray(entry) ? entry[0] : entry);
          invariant(!plugins.includes("expo-iap"), "obsolete IAP plugin remains");
          invariant(!plugins.includes("expo-sqlite"), "unused SQLite plugin remains");
          invariant(!plugins.includes("./plugins/withLocalOnlyDatabase"), "unused SQLite backup plugin remains");
          const splashPlugin = (expo.plugins || []).find(
            (entry) => Array.isArray(entry) && entry[0] === "expo-splash-screen",
          );
          invariant(splashPlugin, "expo-splash-screen plugin is missing");
          const splash = splashPlugin[1] || {};
          invariant(Object.keys(splash).sort().join(",") === "android,ios", "splash config is not platform-only");
          const checkSplash = (platform, image) => {
            const value = splash[platform] || {};
            invariant(
              Object.keys(value).sort().join(",") === "backgroundColor,image,imageWidth,resizeMode",
              `${platform} splash keys changed`,
            );
            invariant(value.backgroundColor === "#E0EEFD", `${platform} splash background changed`);
            invariant(value.image === image, `${platform} splash image changed`);
            invariant(value.imageWidth === 176, `${platform} splash width changed`);
            invariant(value.resizeMode === "contain", `${platform} splash resize mode changed`);
          };
          checkSplash("ios", "./assets/splash-ios-icon.png");
          checkSplash("android", "./assets/android-splash-icon.png");
          const adaptive = expo.android?.adaptiveIcon || {};
          invariant(adaptive.backgroundColor === "#E0EEFD", "adaptive icon background changed");
          invariant(adaptive.foregroundImage === "./assets/android-icon-foreground.png", "adaptive foreground changed");
          invariant(adaptive.monochromeImage === "./assets/android-icon-monochrome.png", "adaptive monochrome changed");
          NODE

          if LC_ALL=C grep -Ein '#(F3FAF7|DDF4E9|126B50|24313A|36B487)' "$app_root/app.json"; then
            echo "Frozen app.json contains a retired brand color." >&2
            exit 1
          fi

          frozen_hashes="$RUNNER_TEMP/frozen-source-file-hashes.txt"
          find "$app_root" -type f -exec shasum -a 256 {} \; > "$frozen_hashes"
          while IFS= read -r retired_sha; do
            if grep -Fq "$retired_sha" "$frozen_hashes"; then
              echo "Frozen source archive contains retired artwork: $retired_sha" >&2
              exit 1
            fi
          done <<'RETIRED_ARTWORK_HASHES'
          0ac5c8f47c5819ae907c64d308f19467d42061d45c8ab06ce5db13a89fbc6d68
          7c965ba2f75eab91654fffe88d34953cbb5b5b30917d212486b88a7b4ed948c4
          42ad06ab7d512c7c4422e854945d4169246828866e3d61cd06483cbf48686e6f
          b2c4e7338969c95b70d71ecb1ed1ac210c39ea310dc5d08a81c8dd9381c9018b
          29e8cf34bbd6e0dda5d4f53268e2f955397ac35a8b5e8c6c3f1f7afabb4057ee
          afbfee8f1dbfc226491b9c9bb62e0a009b74819de7c1b137d8c4da9f9ed98a8c
          0e9f04c4edfac5e8b7b089c8c9c311b4aa99b8985efbb6542e9b908ff69beb72
          beb5d1a261ee700f37dea82d6fc680166b34f1fe1233730be49a38f70b045685
          6af5e08e78985f50bbb497c759a1cb9f8bffac2398db93baca81cb98e23501af
          RETIRED_ARTWORK_HASHES

          cp release-overlay/App.tsx "$app_root/App.tsx"
          cp release-overlay/app.html "$app_root/app.html"
          cp release-overlay/package.json "$app_root/package.json"
          cp release-overlay/package-lock.json "$app_root/package-lock.json"
          cp release-overlay/ios/AppDelegate.swift \
            "$app_root/ios/$SCHEME/AppDelegate.swift"
          cp release-overlay/ios/skadnetwork-ids.txt \
            "$app_root/ios/skadnetwork-ids.txt"
          cp release-overlay/ios/Podfile.lock \
            "$app_root/ios/Podfile.lock"
          cp release-overlay/ios/en.lproj/InfoPlist.strings \
            "$app_root/ios/$SCHEME/Supporting/en.lproj/InfoPlist.strings"
          cp release-overlay/ios/es-PR.lproj/InfoPlist.strings \
            "$app_root/ios/$SCHEME/Supporting/es-PR.lproj/InfoPlist.strings"
          cp release-overlay/assets/app-icon.png.base64 \
            "$app_root/assets/app-icon.png.base64"
          cp release-overlay/assets/app-icon.png \
            "$app_root/assets/app-icon.png"
          cp release-overlay/assets/app-logo-256.png.base64 \
            "$app_root/assets/app-logo-256.png.base64"
          cp release-overlay/assets/app-logo-256.png \
            "$app_root/assets/app-logo-256.png"
          cp release-overlay/assets/brand-logo-source-1254.png \
            "$app_root/assets/brand-logo-source-1254.png"
          cp release-overlay/assets/splash-logo-176.png \
            "$app_root/assets/splash-logo-176.png"
          cp release-overlay/assets/splash-logo-352.png \
            "$app_root/assets/splash-logo-352.png"
          cp release-overlay/assets/splash-logo-528.png \
            "$app_root/assets/splash-logo-528.png"
          cp release-overlay/assets/android-icon-foreground.png \
            "$app_root/assets/android-icon-foreground.png"
          cp release-overlay/assets/android-icon-monochrome.png \
            "$app_root/assets/android-icon-monochrome.png"
          cp release-overlay/assets/android-splash-icon.png \
            "$app_root/assets/android-splash-icon.png"
          cp release-overlay/assets/play-store-icon-512.png \
            "$app_root/assets/play-store-icon-512.png"
          cp release-overlay/scripts/embed-web-app.mjs \
            "$app_root/scripts/embed-web-app.mjs"
          cp release-overlay/scripts/configure-ios-test.sh \
            "$app_root/scripts/configure-ios-test.sh"
          cp release-overlay/scripts/verify-test-release.mjs \
            "$app_root/scripts/verify-test-release.mjs"

          cd "$app_root"
          node scripts/embed-web-app.mjs app.html src/appHtml.ts
          bash scripts/configure-ios-test.sh "$app_root"

          plist_path="$app_root/ios/$SCHEME/Info.plist"
          project_path="$app_root/ios/$SCHEME.xcodeproj/project.pbxproj"
          plist_buddy=/usr/libexec/PlistBuddy

          "$plist_buddy" -c "Set :CFBundleDisplayName SNAP-EBT WIC Tracker" "$plist_path"
          "$plist_buddy" -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$plist_path"
          "$plist_buddy" -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist_path"
          "$plist_buddy" -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $IOS_BUNDLE_ID" "$plist_path"
          /usr/bin/sed -i '' \
            's/SNAP-EBT & WIC Tracker QA/SNAP-EBT WIC Tracker/g' \
            "$app_root/ios/$SCHEME/Supporting/en.lproj/InfoPlist.strings" \
            "$app_root/ios/$SCHEME/Supporting/es-PR.lproj/InfoPlist.strings"
          grep -Fq 'CFBundleDisplayName = "SNAP-EBT WIC Tracker";' \
            "$app_root/ios/$SCHEME/Supporting/en.lproj/InfoPlist.strings"
          grep -Fq 'CFBundleDisplayName = "SNAP-EBT WIC Tracker";' \
            "$app_root/ios/$SCHEME/Supporting/es-PR.lproj/InfoPlist.strings"

          developer_signing='"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";'
          if [[ "$(grep -Fc "$developer_signing" "$project_path")" != "2" ]]; then
            echo "Expected exactly two frozen iPhone Developer signing identities." >&2
            exit 1
          fi

          /usr/bin/sed -i '' \
            -e 's/com\.goodusestudios\.snapebtgrocerytracker\.qa/com.lateefrazaqoyetola.snapebtwictracker/g' \
            -e '/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/d' \
            "$project_path"

          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = "com.lateefrazaqoyetola.snapebtwictracker";' \
            "$project_path"
          if grep -Fq 'com.goodusestudios.snapebtgrocerytracker.qa' "$project_path"; then
            echo "The obsolete QA bundle ID remains in the Xcode project." >&2
            exit 1
          fi
          if grep -Fq 'CODE_SIGN_IDENTITY' "$project_path"; then
            echo "An explicit code-signing identity remains in the Xcode project." >&2
            exit 1
          fi

          echo "APP_ROOT=$app_root" >> "$GITHUB_ENV"

      - name: Install locked JavaScript dependencies and verify release gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          npm ci --no-audit --no-fund
          npm run typecheck
          node scripts/verify-test-release.mjs

      - name: Install locked iOS dependencies
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          cd "$APP_ROOT/ios"
          expected_cocoapods="$(ruby -ne 'puts $1 if $_ =~ /^COCOAPODS:\s*(\S+)/' Podfile.lock)"
          [[ -n "$expected_cocoapods" ]]
          [[ "$(pod --version)" == "$expected_cocoapods" ]]
          pod install --deployment
          cmp -s Podfile.lock Pods/Manifest.lock

      - name: Sign, validate, and upload internal TestFlight build
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing encrypted GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/SNAP-EBT-WIC-Tracker.xcarchive"
          export_path="$RUNNER_TEMP/testflight-upload"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cleanup() {
            rm -f "$key_path" "$export_options"
          }
          trap cleanup EXIT

          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          unset ASC_PRIVATE_KEY
          chmod 600 "$key_path"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$key_path"
          grep -Fq -- '-----END PRIVATE KEY-----' "$key_path"

          set -o pipefail
          xcodebuild \
            -workspace "$APP_ROOT/ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean archive | xcbeautify

          app_path="$(find "$archive_path/Products/Applications" -maxdepth 1 \
            -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_info="$(codesign -dvv "$app_path" 2>&1)"
          grep -Fq 'Signature=adhoc' <<< "$signature_info"

          plist="$app_path/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$MARKETING_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$BUILD_NUMBER" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$plist")" == "$GOOGLE_TEST_APP_ID" ]]
          grep -aFq "$GOOGLE_TEST_BANNER_ID" "$app_path/main.jsbundle"
          grep -aFq 'requestNonPersonalizedAdsOnly' "$app_path/main.jsbundle"

          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :testFlightInternalTestingOnly bool true' "$export_options"

          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | xcbeautify

      - name: Record upload result
        shell: bash
        run: |
          {
            echo "## Internal TestFlight upload complete"
            echo
            echo "- App Store ID: $APP_STORE_ID"
            echo "- Bundle ID: $IOS_BUNDLE_ID"
            echo "- Version: $MARKETING_VERSION ($BUILD_NUMBER)"
            echo "- Ads: official Google test IDs; non-personalized treatment forced"
            echo "- Distribution: permanently internal TestFlight only"
            echo
            echo "Wait for Apple processing, then add this build to an internal tester group."
          } >> "$GITHUB_STEP_SUMMARY"

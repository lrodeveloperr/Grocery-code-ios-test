name: Patch ad verifier on macOS

on:
  push:
    branches:
      - fix/ios-iap-ad-qa-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ios-iap-ad-qa-hardening-20260826
          fetch-depth: 0

      - name: Patch release verifier
        run: node scripts/fix-ad-release-verifier.mjs

      - name: Commit verifier if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Verifier already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-overlay/scripts/verify-test-release.mjs
          git commit -m "Require self-healing ad recovery in release verifier"
          git push origin HEAD:fix/ios-iap-ad-qa-hardening-20260826

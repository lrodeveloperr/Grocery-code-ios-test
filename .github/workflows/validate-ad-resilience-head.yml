name: Validate final ad resilience runtime

on:
  push:
    branches:
      - fix/ios-iap-ad-qa-hardening-20260826

permissions:
  contents: read

concurrency:
  group: validate-final-ad-resilience
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_AD_PROFILE: test
      EXPO_PUBLIC_BUILD_PROFILE: qa
      EXPO_PUBLIC_ADMOB_PUBLISHER_ID: ""
      EXPO_PUBLIC_IOS_ADMOB_APP_ID: ""
      EXPO_PUBLIC_IOS_ADMOB_BANNER_ID: ""
      EXPECTED_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
      EXPECTED_ADMOB_BANNER_ID: ca-app-pub-3940256099942544/2934735716
      SOURCE_ZIP: SNAP-EBT-Grocery-Tracker-iOS-QA-Source-v1.0.0.zip
      SOURCE_ZIP_SHA256: 23d938c18df0e185e54946759a3075ef42ce2a6cbc3a0bff99b3a085387e4fcd

    steps:
      - name: Check out final branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ios-iap-ad-qa-hardening-20260826
          persist-credentials: false

      - name: Assemble reviewed iOS source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(shasum -a 256 "$SOURCE_ZIP" | awk '{print $1}')"
          [[ "$actual_sha" == "$SOURCE_ZIP_SHA256" ]]
          extraction_root="$RUNNER_TEMP/latest-ios-source"
          mkdir -p "$extraction_root"
          /usr/bin/ditto -x -k "$SOURCE_ZIP" "$extraction_root"
          app_root="$extraction_root/grocery-benefits-tracker"
          test -f "$app_root/ios/SNAPEBTGroceryTrackerQA.xcodeproj/project.pbxproj"

          cp release-overlay/App.tsx "$app_root/App.tsx"
          cp release-overlay/app.html "$app_root/app.html"
          cp release-overlay/app.config.js "$app_root/app.config.js"
          cp release-overlay/package.json "$app_root/package.json"
          cp release-overlay/package-lock.json "$app_root/package-lock.json"
          cp release-overlay/ios/AppDelegate.swift "$app_root/ios/SNAPEBTGroceryTrackerQA/AppDelegate.swift"
          cp release-overlay/ios/skadnetwork-ids.txt "$app_root/ios/skadnetwork-ids.txt"
          cp release-overlay/ios/en.lproj/InfoPlist.strings "$app_root/ios/SNAPEBTGroceryTrackerQA/Supporting/en.lproj/InfoPlist.strings"
          cp release-overlay/ios/es-PR.lproj/InfoPlist.strings "$app_root/ios/SNAPEBTGroceryTrackerQA/Supporting/es-PR.lproj/InfoPlist.strings"
          cp release-overlay/assets/app-icon.png.base64 "$app_root/assets/app-icon.png.base64"
          cp release-overlay/assets/brand-logo-ui.png "$app_root/assets/brand-logo-ui.png"
          cp release-overlay/assets/brand-logo-master.jpeg "$app_root/assets/brand-logo-master.jpeg"
          cp release-overlay/scripts/embed-web-app.mjs "$app_root/scripts/embed-web-app.mjs"
          cp release-overlay/scripts/configure-ios-test.sh "$app_root/scripts/configure-ios-test.sh"
          cp release-overlay/scripts/verify-test-release.mjs "$app_root/scripts/verify-test-release.mjs"
          cp release-overlay/scripts/finalize-ios-notices.mjs "$app_root/scripts/finalize-ios-notices.mjs"
          cp release-overlay/scripts/verify-ios-privacy-manifests.mjs "$app_root/scripts/verify-ios-privacy-manifests.mjs"
          cp release-overlay/tests/App.ui.test.tsx "$app_root/tests/App.ui.test.tsx"
          rm -f "$app_root/src/billing.ts"
          cp release-overlay/src/removeAdsPurchase.ts "$app_root/src/removeAdsPurchase.ts"

          cd "$app_root"
          node scripts/embed-web-app.mjs app.html src/appHtml.ts
          bash scripts/configure-ios-test.sh "$app_root"
          echo "APP_ROOT=$app_root" >> "$GITHUB_ENV"

      - name: Validate JavaScript and release gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          npm ci --no-audit --no-fund
          mkdir -p ../legal-pages-final
          npm run generate:notices
          npm run typecheck
          npm run test:logic
          npm run test:ui
          node scripts/verify-test-release.mjs

      - name: Install iOS dependencies
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          cd "$APP_ROOT/ios"
          pod install --repo-update
          node "$APP_ROOT/scripts/verify-ios-privacy-manifests.mjs" \
            --app-manifest "$APP_ROOT/ios/SNAPEBTGroceryTrackerQA/PrivacyInfo.xcprivacy" \
            --sdk-root "$APP_ROOT/ios/Pods" \
            --report "$RUNNER_TEMP/privacy-manifest-installed.json"
          node "$APP_ROOT/scripts/finalize-ios-notices.mjs"

      - name: Compile release app for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$APP_ROOT/ios/SNAPEBTGroceryTrackerQA.xcworkspace" \
            -scheme SNAPEBTGroceryTrackerQA \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build | xcbeautify

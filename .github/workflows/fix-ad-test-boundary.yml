name: Fix ad test boundary

on:
  push:
    branches:
      - fix/ios-iap-ad-qa-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ad-test-boundary-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ios-iap-ad-qa-hardening-20260826
          fetch-depth: 0

      - name: Update UI test boundary
        run: node scripts/fix-ad-test-boundary.mjs

      - name: Commit test update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No test changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-overlay/tests/App.ui.test.tsx
          git commit -m "Align ad resilience UI test boundary [ad-test-boundary-fixed]"
          git push origin HEAD:fix/ios-iap-ad-qa-hardening-20260826

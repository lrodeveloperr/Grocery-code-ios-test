name: Wire ad resilience overlay

on:
  push:
    branches:
      - fix/ios-iap-ad-qa-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[overlay-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ios-iap-ad-qa-hardening-20260826
          fetch-depth: 0

      - name: Wire helper into release assembly
        run: node scripts/wire-ad-resilience-overlay.mjs

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No wiring changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-latest-ios.yml \
            .github/workflows/upload-testflight-test-ads.yml \
            .github/workflows/upload-app-store-production.yml \
            release-overlay/scripts/verify-test-release.mjs
          git commit -m "Wire ad resilience helper into iOS release assembly [overlay-wired]"
          git push origin HEAD:fix/ios-iap-ad-qa-hardening-20260826

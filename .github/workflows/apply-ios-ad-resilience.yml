name: Apply iOS ad resilience patch

on:
  push:
    branches:
      - fix/ios-iap-ad-qa-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ad-resilience-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/ios-iap-ad-qa-hardening-20260826
          fetch-depth: 0

      - name: Apply resilience patch
        run: node scripts/apply-ios-ad-resilience.mjs

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-overlay/App.tsx release-overlay/tests/App.ui.test.tsx IOS_IAP_AD_QA_HARDENING.md
          git commit -m "Harden ad recovery for real-world network outages [ad-resilience-applied]"
          git push origin HEAD:fix/ios-iap-ad-qa-hardening-20260826

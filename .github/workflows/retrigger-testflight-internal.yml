name: Retrigger internal TestFlight distribution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retrigger-testflight-internal.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    name: Dispatch approved internal TestFlight distribution
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch existing protected distribution workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/distribute-testflight-internal.yml/dispatches" \
            -d '{"ref":"main"}'

          run_id=""
          run_url=""
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/distribute-testflight-internal.yml/runs?event=workflow_dispatch&branch=main&per_page=10"
          for attempt in {1..36}; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            run_id="$(printf '%s' "$response" | jq -r --arg started "$started_at" '.workflow_runs | map(select(.created_at >= $started)) | .[0].id // empty')"
            run_url="$(printf '%s' "$response" | jq -r --arg started "$started_at" '.workflow_runs | map(select(.created_at >= $started)) | .[0].html_url // empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Could not resolve the TestFlight distribution run ID." >&2; exit 1; }
          printf '{"run_id":%s,"run_url":"%s","build_number":"7","trigger_sha":"%s"}\n' "$run_id" "$run_url" "$GITHUB_SHA" > .github/last-testflight-distribution-run.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Persist TestFlight run pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-testflight-distribution-run.json
          git commit -m "Record TestFlight distribution run ${{ steps.dispatch.outputs.run_id }}"
          git push origin HEAD:main

# Explicit retrigger marker: 2026-08-29

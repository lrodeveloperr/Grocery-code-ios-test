name: Retrigger internal TestFlight distribution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retrigger-testflight-internal.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch approved internal TestFlight distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing protected distribution workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/distribute-testflight-internal.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Protected build-7 internal TestFlight distribution dispatched."

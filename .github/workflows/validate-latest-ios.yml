name: Validate latest iOS release profiles

on:
  pull_request:
    branches: [main]
    paths:
      - "release-overlay/**"
      - "SNAP-EBT-Grocery-Tracker-iOS-QA-Source-v1.0.0.zip"
      - ".github/workflows/validate-latest-ios.yml"
      - ".github/workflows/upload-testflight-test-ads.yml"
      - ".github/workflows/upload-app-store-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-ios-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: ${{ matrix.label }} · NPA · iOS simulator
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: test
            label: Test IDs
            build_profile: qa
            publisher_id: ""
            app_id: ca-app-pub-3940256099942544~1458002511
            banner_id: ca-app-pub-3940256099942544/2934735716
            configure_script: configure-ios-test.sh
            artifact_suffix: Test
          - profile: production
            label: Production IDs
            build_profile: production
            publisher_id: "8054612600809568"
            app_id: ca-app-pub-8054612600809568~1748518282
            banner_id: ca-app-pub-8054612600809568/3872496047
            configure_script: configure-ios-production.sh
            artifact_suffix: Production
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_AD_PROFILE: ${{ matrix.profile }}
      EXPO_PUBLIC_BUILD_PROFILE: ${{ matrix.build_profile }}
      EXPO_PUBLIC_ADMOB_PUBLISHER_ID: ${{ matrix.publisher_id }}
      EXPO_PUBLIC_IOS_ADMOB_APP_ID: ${{ matrix.app_id }}
      EXPO_PUBLIC_IOS_ADMOB_BANNER_ID: ${{ matrix.banner_id }}
      EXPECTED_ADMOB_APP_ID: ${{ matrix.app_id }}
      EXPECTED_ADMOB_BANNER_ID: ${{ matrix.banner_id }}
      CONFIGURE_SCRIPT: ${{ matrix.configure_script }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
      SOURCE_ZIP: SNAP-EBT-Grocery-Tracker-iOS-QA-Source-v1.0.0.zip
      SOURCE_ZIP_SHA256: 23d938c18df0e185e54946759a3075ef42ce2a6cbc3a0bff99b3a085387e4fcd

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assemble latest application source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(shasum -a 256 "$SOURCE_ZIP" | awk '{print $1}')"
          if [[ "$actual_sha" != "$SOURCE_ZIP_SHA256" ]]; then
            echo "Frozen native source archive digest mismatch." >&2
            exit 1
          fi

          extraction_root="$RUNNER_TEMP/latest-ios-source"
          mkdir -p "$extraction_root"
          /usr/bin/ditto -x -k "$SOURCE_ZIP" "$extraction_root"
          app_root="$extraction_root/grocery-benefits-tracker"
          test -f "$app_root/ios/SNAPEBTGroceryTrackerQA.xcodeproj/project.pbxproj"

          cp release-overlay/App.tsx "$app_root/App.tsx"
          cp release-overlay/app.html "$app_root/app.html"
          cp release-overlay/app.config.js "$app_root/app.config.js"
          cp release-overlay/package.json "$app_root/package.json"
          cp release-overlay/package-lock.json "$app_root/package-lock.json"
          cp release-overlay/ios/AppDelegate.swift \
            "$app_root/ios/SNAPEBTGroceryTrackerQA/AppDelegate.swift"
          cp release-overlay/ios/skadnetwork-ids.txt \
            "$app_root/ios/skadnetwork-ids.txt"
          cp release-overlay/ios/en.lproj/InfoPlist.strings \
            "$app_root/ios/SNAPEBTGroceryTrackerQA/Supporting/en.lproj/InfoPlist.strings"
          cp release-overlay/ios/es-PR.lproj/InfoPlist.strings \
            "$app_root/ios/SNAPEBTGroceryTrackerQA/Supporting/es-PR.lproj/InfoPlist.strings"
          cp release-overlay/assets/app-icon.png.base64 \
            "$app_root/assets/app-icon.png.base64"
          cp release-overlay/assets/brand-logo-ui.png \
            "$app_root/assets/brand-logo-ui.png"
          cp release-overlay/assets/brand-logo-master.jpeg \
            "$app_root/assets/brand-logo-master.jpeg"
          cp release-overlay/scripts/embed-web-app.mjs \
            "$app_root/scripts/embed-web-app.mjs"
          cp release-overlay/scripts/configure-ios-test.sh \
            "$app_root/scripts/configure-ios-test.sh"
          cp release-overlay/scripts/configure-ios-production.sh \
            "$app_root/scripts/configure-ios-production.sh"
          cp release-overlay/scripts/verify-test-release.mjs \
            "$app_root/scripts/verify-test-release.mjs"
          cp release-overlay/scripts/finalize-ios-notices.mjs \
            "$app_root/scripts/finalize-ios-notices.mjs"
          cp release-overlay/scripts/verify-ios-privacy-manifests.mjs \
            "$app_root/scripts/verify-ios-privacy-manifests.mjs"
          test -d "$app_root/tests"
          cp release-overlay/tests/App.ui.test.tsx \
            "$app_root/tests/App.ui.test.tsx"

          test -d "$app_root/src"
          rm -f "$app_root/src/billing.ts"
          test ! -e "$app_root/src/billing.ts"
          cp release-overlay/src/removeAdsPurchase.ts \
            "$app_root/src/removeAdsPurchase.ts"

          cd "$app_root"
          node scripts/embed-web-app.mjs app.html src/appHtml.ts
          bash "scripts/$CONFIGURE_SCRIPT" "$app_root"
          echo "APP_ROOT=$app_root" >> "$GITHUB_ENV"

      - name: Install locked JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          node --version
          npm --version
          npm ci --no-audit --no-fund
          mkdir -p ../legal-pages-final
          npm run generate:notices
          grep -Fq -- 'expo-iap@5.2.4' THIRD_PARTY_NOTICES.txt
          grep -Fq -- 'expo-iap@5.2.4' src/thirdPartyNotices.ts
          grep -Fq -- 'expo-tracking-transparency@57.0.1' THIRD_PARTY_NOTICES.txt
          grep -Fq -- 'expo-tracking-transparency@57.0.1' src/thirdPartyNotices.ts

      - name: Verify source, privacy gates, and bridges
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          npm run typecheck
          npm run test:logic
          npm run test:ui
          node scripts/verify-test-release.mjs
          ruby -c "$GITHUB_WORKSPACE/release-overlay/scripts/app-store-connect-jwt.rb"

      - name: Install locked iOS dependencies
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          cd "$APP_ROOT/ios"
          pod install --repo-update
          grep -Fq 'ExpoIap (5.2.4)' Podfile.lock
          grep -Fq 'openiap (3.1.1)' Podfile.lock
          grep -Fq 'ExpoTrackingTransparency (57.0.1)' Podfile.lock
          grep -Fq 'Google-Mobile-Ads-SDK (13.5.0)' Podfile.lock
          grep -Fq 'GoogleUserMessagingPlatform (3.1.0)' Podfile.lock
          node "$APP_ROOT/scripts/verify-ios-privacy-manifests.mjs" \
            --app-manifest "$APP_ROOT/ios/SNAPEBTGroceryTrackerQA/PrivacyInfo.xcprivacy" \
            --sdk-root "$APP_ROOT/ios/Pods" \
            --report "$RUNNER_TEMP/privacy-manifest-installed.json"
          node "$APP_ROOT/scripts/finalize-ios-notices.mjs"
          grep -Fq 'iOS CocoaPods acknowledgements' "$APP_ROOT/THIRD_PARTY_NOTICES.txt"
          grep -Fqi 'openiap' "$APP_ROOT/src/thirdPartyNotices.ts"
          grep -Fqi 'expo-tracking-transparency' "$APP_ROOT/src/thirdPartyNotices.ts"

      - name: Compile release app for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$APP_ROOT/ios/SNAPEBTGroceryTrackerQA.xcworkspace" \
            -scheme SNAPEBTGroceryTrackerQA \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build | xcbeautify

      - name: Archive unsigned device build and validate packaged privacy manifests
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/Grocery-Benefits-Tracker-Unsigned.xcarchive"
          xcodebuild \
            -workspace "$APP_ROOT/ios/SNAPEBTGroceryTrackerQA.xcworkspace" \
            -scheme SNAPEBTGroceryTrackerQA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/ArchiveDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean archive | xcbeautify

          archive_app="$(find "$archive_path/Products/Applications" -maxdepth 1 \
            -type d -name '*.app' -print -quit)"
          test -n "$archive_app"
          node "$APP_ROOT/scripts/verify-ios-privacy-manifests.mjs" \
            --app-manifest "$archive_app/PrivacyInfo.xcprivacy" \
            --sdk-root "$APP_ROOT/ios/Pods" \
            --bundle-root "$archive_app" \
            --report "$RUNNER_TEMP/privacy-manifest-archive.json"

      - name: Package simulator application
        shell: bash
        run: |
          set -euo pipefail
          product_root="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator"
          app_path="$(find "$product_root" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          test -f "$app_path/main.jsbundle"
          if [[ "$EXPO_PUBLIC_AD_PROFILE" == "production" ]]; then
            # The Google Mobile Ads module contains its built-in TestIds constant
            # even when the reviewed runtime branch selects only the live unit.
            # Require the live ID here; source tests and Info.plist checks verify
            # the production fail-closed selection and publisher ownership.
            grep -aFq "$EXPECTED_ADMOB_BANNER_ID" "$app_path/main.jsbundle"
          fi

          artifact_root="$RUNNER_TEMP/artifact"
          mkdir -p "$artifact_root"
          cp "$RUNNER_TEMP/privacy-manifest-installed.json" "$artifact_root/"
          cp "$RUNNER_TEMP/privacy-manifest-archive.json" "$artifact_root/"
          node "$APP_ROOT/scripts/verify-ios-privacy-manifests.mjs" \
            --app-manifest "$app_path/PrivacyInfo.xcprivacy" \
            --sdk-root "$APP_ROOT/ios/Pods" \
            --bundle-root "$app_path" \
            --report "$artifact_root/privacy-manifest-packaged.json"
          artifact_zip="$artifact_root/Grocery-Benefits-Tracker-iOS-$ARTIFACT_SUFFIX.app.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app_path" "$artifact_zip"
          shasum -a 256 "$artifact_zip" > "$artifact_zip.sha256"
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" \
            "$app_path/Info.plist" | grep -Fx "$EXPECTED_ADMOB_APP_ID"
          /usr/libexec/PlistBuddy -c "Print :GADDelayAppMeasurementInit" \
            "$app_path/Info.plist" | grep -Fx "true"
          /usr/libexec/PlistBuddy -c "Print :NSUserTrackingUsageDescription" \
            "$app_path/Info.plist" | grep -Fx "Your permission allows this app and its advertising partners to use a device identifier to measure non-personalized ads. Denying permission does not limit app features."
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" \
            "$app_path/Info.plist" | grep -Fx "Grocery Benefits Tracker"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" \
            "$app_path/Info.plist" | grep -Fx "Grocery Benefits Tracker"
          /usr/libexec/PlistBuddy -c "Print :NSPrivacyTracking" \
            "$app_path/PrivacyInfo.xcprivacy" | grep -Fx "false"
          if /usr/libexec/PlistBuddy -c "Print :NSPrivacyTrackingDomains" \
            "$app_path/PrivacyInfo.xcprivacy" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c "Print :NSPrivacyCollectedDataTypes" \
            "$app_path/PrivacyInfo.xcprivacy" >/dev/null 2>&1; then
            echo "The packaged app manifest duplicates SDK privacy declarations." >&2
            exit 1
          fi
          legacy_identity_pattern="SNAP & EBT Grocery Tracker QA|SNAP-EBT & WIC Benefits Tracker|SNAP-EBT WIC Tracker"
          while IFS= read -r metadata_file; do
            if /usr/bin/plutil -convert xml1 -o - "$metadata_file" 2>/dev/null | \
              grep -Eiq "$legacy_identity_pattern"; then
              echo "Legacy public identity remains in packaged metadata: $metadata_file" >&2
              exit 1
            fi
          done < <(find "$app_path" -type f \( -name "*.plist" -o -name "*.strings" \) -print)

      - name: Upload simulator application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Grocery-Benefits-Tracker-iOS-${{ matrix.artifact_suffix }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/artifact/*
          if-no-files-found: error
          retention-days: 7

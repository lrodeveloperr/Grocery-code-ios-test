name: Finalize iOS App Store listing

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type FINALIZE IOS LISTING to apply canonical metadata
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grocery-ios-app-store-listing-write
  cancel-in-progress: false

jobs:
  finalize:
    name: Apply and verify iOS listing metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store-internal
    env:
      APP_STORE_ID: "6799562282"
      MARKETING_VERSION: "1.0"
      APP_STORE_METADATA_PATH: app-store/APP_STORE_METADATA.md
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

    steps:
      - name: Check out canonical metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate protected inputs and metadata source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "FINALIZE IOS LISTING" ]] || {
            echo "Confirmation did not match FINALIZE IOS LISTING." >&2
            exit 1
          }
          for key in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [[ -n "${!key:-}" ]] || { echo "Missing protected $key input." >&2; exit 1; }
          done
          [[ -s "$APP_STORE_METADATA_PATH" ]]

      - name: Apply and verify canonical listing
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          export ASC_KEY_PATH="$key_path"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          ruby release-overlay/scripts/sync-app-store-listing.rb

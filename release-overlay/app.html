 --red:#ff3b30;--red2:#fff0ef;--purple:#af52de;--shadow:0 8px 24px rgba(0,0,0,.07);--radius:20px;--bottom:84px
}
*{-webkit-tap-highlight-color:transparent}
html{background:#f2f2f7;overscroll-behavior-y:none}
body{background:#f2f2f7;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{touch-action:manipulation}
.app-shell{min-height:100dvh;background:#f2f2f7}
.topbar{height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;grid-template-columns:40px 1fr 40px;background:rgba(249,249,249,.82);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid rgba(60,60,67,.18)}
.topbar-title{font-size:17px;font-weight:600;letter-spacing:-.2px;color:#111}

.main{padding:calc(68px + env(safe-area-inset-top)) 16px calc(var(--bottom) + 22px + env(safe-area-inset-bottom));max-width:760px;min-height:100dvh}
.page{gap:16px}
.page-head{align-items:flex-end;margin-bottom:0}

.nav-btn .ico{width:24px;height:24px}

.nav-btn.active{color:#007aff}
.drawer-shade{background:transparent;visibility:hidden;backdrop-filter:none;-webkit-backdrop-filter:none}
.drawer-shade.open{background:rgba(0,0,0,.28);visibility:visible;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.drawer{width:min(88vw,360px);background:#f7f7fa;box-shadow:none;padding:calc(18px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));border-radius:0 28px 28px 0}
.drawer.open{box-shadow:20px 0 60px rgba(0,0,0,.18)}
.drawer-brand{padding:6px 8px 18px}
.drawer-logo{width:54px;height:54px;border-radius:13px;overflow:hidden}

.onboard-logo{border-radius:20px;overflow:hidden}

.drawer-links{gap:8px}
.drawer-link{min-height:48px;border-radius:14px;padding:12px 13px;background:#fff;color:#1c1c1e;font-weight:600;box-shadow:0 .5px 0 rgba(60,60,67,.12)}
.drawer-link.active{background:#e8f2ff;color:#007aff}
.drawer-link:active{transform:scale(.985)}
.drawer-note{color:#8e8e93;font-size:10px}
.onboard-legal-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}

.legal-version{display:block;margin-top:10px;text-align:center;color:#8e8e93;font-size:10px}
.card,.summary-card,.metric-card,.entry-card,.basket-card,.report-card,.settings-card,.saved-card,.history-card{border:.5px solid rgba(60,60,67,.14);background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.045)}
.summary-card{border-radius:22px;padding:16px;min-height:132px}
.summary-card.cash{min-height:146px}
.summary-card.snap{background:linear-gradient(160deg,#fff,#f5faff)}

.summary-card.over{background:linear-gradient(160deg,#fff,#fff7f6);border-color:rgba(255,59,48,.22)}
.summary-top{font-size:11px;font-weight:700;letter-spacing:.3px;color:#6e6e73}
.summary-card strong{font-size:26px;font-weight:700;color:#111;letter-spacing:-.7px}
.summary-card small,.mini-note{color:#8e8e93}
.mini-progress,.progress{background:#e5e5ea}
.mini-progress i,.progress i{background:#007aff}
.btn{min-height:50px;border:0;border-radius:13px;background:#007aff;color:#fff;font-size:16px;font-weight:600;box-shadow:none;padding:12px 16px}
.btn:active{transform:scale(.985);filter:brightness(.96)}
.btn.secondary{background:#e9e9ee;color:#007aff;border:0}
.btn.green{background:#34c759;color:#fff}
.btn.danger{background:#fff0ef;color:#ff3b30;border:0}
.btn.ghost{background:transparent;color:#007aff;border:0}
.btn.slim{min-height:36px;border-radius:11px;font-size:13px;padding:8px 12px}
.input,.select,input[type="text"],input[type="number"],input[type="date"],input[type="search"]{min-height:48px;border:0;border-radius:12px;background:#f2f2f7;color:#1c1c1e;padding:12px 13px;box-shadow:inset 0 0 0 .5px rgba(60,60,67,.12);outline:none}
.input:focus,.select:focus,input:focus{box-shadow:inset 0 0 0 1.5px #007aff;background:#fff}
label,.label{font-size:12px;font-weight:600;color:#6e6e73}
.chip,.funding-chip,.seg-btn,.choice{border:.5px solid rgba(60,60,67,.18);background:#fff;border-radius:12px;color:#1c1c1e;box-shadow:none}
.chip.active,.funding-chip.active,.seg-btn.active,.choice.selected{background:#007aff;color:#fff;border-color:#007aff}
.suggest-box,.suggestions{background:#fff;border:.5px solid rgba(60,60,67,.16);border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.12);overflow:hidden}
.suggest,.suggestion{border-bottom:.5px solid rgba(60,60,67,.12);background:#fff}
.suggest:last-child,.suggestion:last-child{border-bottom:0}
.modal-shade{background:rgba(0,0,0,.30);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal{position:relative;background:#f2f2f7;border-radius:24px 24px 0 0;padding:24px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(0,0,0,.18);max-height:90dvh;-webkit-overflow-scrolling:touch}
.modal:before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;border-radius:99px;background:#c7c7cc;transform:translateX(-50%)}
.modal-head h2{font-size:22px;font-weight:700;color:#111;letter-spacing:-.4px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.6px;color:#007aff}
.modal p,.small-copy{color:#6e6e73;font-size:13px}
.notice,.checkout-message{border-radius:13px;padding:11px 12px}
.notice.blocker,.checkout-message.blocker{background:#fff0ef;border:.5px solid rgba(255,59,48,.2);color:#b4231a}
.notice.warning,.checkout-message.warning{background:#fff5e4;border:.5px solid rgba(255,159,10,.25);color:#8a5700}
.notice.info,.checkout-message.info{background:#eef6ff;border:.5px solid rgba(0,122,255,.18);color:#335f8a}
.review-summary{background:#fff;border-radius:14px;border:.5px solid rgba(60,60,67,.12)}
.price-display{font-size:38px;font-weight:700;color:#111;letter-spacing:-1px}
.keypad button,.quick-cents button{height:52px;border:0;border-radius:12px;background:#fff;color:#111;font-size:20px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.keypad button:active,.quick-cents button:active{background:#e5e5ea}
.toast{background:rgba(28,28,30,.94);color:#fff;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.onboarding{background:#f2f2f7;padding:calc(28px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
.onboarding .card{border-radius:22px}
.onboarding h1{font-size:34px;font-weight:700;letter-spacing:-1.1px;color:#111}
.onboarding .step-dot,.step-dots i{background:#c7c7cc}.onboarding .step-dot.active,.step-dots i.active{background:#007aff}
@supports(-webkit-touch-callout:none){.topbar,.bottom-nav,.drawer,.modal{will-change:transform}.main{-webkit-overflow-scrolling:touch}}


.modal input[type=date],.modal select,.modal input{background:#fff}.modal input[type=date]{color:var(--text);-webkit-text-fill-color:var(--text);appearance:none;-webkit-appearance:none}.modal input[type=date]::-webkit-date-and-time-value{color:var(--text);text-align:left}.modal input[type=date]::-webkit-calendar-picker-indicator{opacity:.78}.base-preset-wrap{display:grid;gap:8px;margin:10px 0 12px}.base-preset-wrap small{color:var(--muted);font-size:11px}.base-preset-list{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.base-preset-btn{flex:none;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px;text-align:left;color:var(--text);min-width:132px}.base-preset-btn b{display:block;font-size:12px}.base-preset-btn span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.base-preset-btn:active{transform:scale(.98)}
:root{
 --ad-preview-fallback-height:58px;
 --ad-runtime-height:58px;
 --ad-visible-height:0px;
 --ad-separator-height:10px;
 --ad-visible-separator-height:0px;
 --ad-nav-height:calc(56px + env(safe-area-inset-bottom));
 --ad-content-gap:22px
}
.main{padding-bottom:calc(var(--ad-nav-height) + var(--ad-visible-height) + var(--ad-visible-separator-height) + var(--ad-content-gap))!important}
.ad-banner{position:fixed;z-index:44;left:10px;right:10px;bottom:calc(var(--ad-nav-height) + var(--ad-visible-separator-height));height:var(--ad-visible-height);min-height:0;overflow:hidden;display:flex;align-items:stretch;border:.5px solid rgba(60,60,67,.14);border-radius:15px;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -4px 16px rgba(0,0,0,.05);color:var(--text)}
.ad-banner[hidden]{display:none!important}
.ad-preview-placeholder{width:100%;height:100%;padding:7px 11px;display:flex;align-items:center;gap:10px}
.ad-provider-mount{display:none;width:100%;height:100%;overflow:hidden;background:transparent}
.ad-banner.ad-mode-real{padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.ad-banner.ad-mode-real .ad-preview-placeholder{display:none!important}
.ad-banner.ad-mode-real .ad-provider-mount{display:block}
.ad-banner.ad-temporarily-hidden{visibility:hidden;pointer-events:none!important}
.ad-nav-separator{position:fixed;z-index:43;left:0;right:0;bottom:var(--ad-nav-height);height:var(--ad-visible-separator-height);background:var(--bg);border-top:.5px solid rgba(60,60,67,.10);pointer-events:none;user-select:none}
.ad-nav-separator[hidden]{display:none!important}
.app-shell.ads-removed .ad-banner,.app-shell.ads-removed .ad-nav-separator{display:none!important}
.ad-badge{flex:none;border:1px solid #d1d1d6;border-radius:7px;padding:3px 6px;font-size:9px;font-weight:800;color:#8e8e93;letter-spacing:.3px}
.ad-copy{min-width:0;display:grid;gap:2px}
.ad-copy b{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-copy small{font-size:9px;color:var(--muted)}
.toast{bottom:calc(var(--ad-nav-height) + var(--ad-visible-height) + var(--ad-visible-separator-height) + 24px)}
@media print{.ad-banner,.ad-nav-separator{display:none!important}.main{padding-bottom:0!important}}
.ad-badge{min-width:max-content;padding-left:7px;padding-right:7px}.modal input[type=date],.onboarding input[type=date]{background:#fff;color:var(--text);-webkit-text-fill-color:var(--text)}.locale-switch{margin-bottom:12px}
.resources-controls{
  display:grid;
  gap:10px
}

.resources-segment{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;
  background:#e9e9ee;
  border-radius:14px
}

.resources-segment button{
  min-height:40px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#6e6e73;
  font-size:13px;
  font-weight:600;
  padding:8px
}

.resources-segment button.active{
  background:#fff;
  color:#111;
  box-shadow:0 1px 4px rgba(0,0,0,.08)
}

.resources-segment button:active{
  transform:scale(.985)
}

.resources-filters{
  display:grid;
  gap:7px
}

.resources-filter-label{
  font-size:11px;
  font-weight:600;
  color:#8e8e93;
  padding-left:2px
}

.resources-filter-chips{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:0 0 3px;
  scrollbar-width:none
}

.resources-filter-chips::-webkit-scrollbar{
  display:none
}

.resources-filter-chips button{
  flex:none;
  min-height:36px;
  border:.5px solid rgba(60,60,67,.18);
  background:#fff;
  color:#3a3a3c;
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  font-weight:600
}

.resources-filter-chips button.active{
  background:#007aff;
  border-color:#007aff;
  color:#fff
}

.resources-filter-chips button:active{
  transform:scale(.97)
}

.resource-grid{
  display:grid;
  gap:10px
}

.resource-card{
  width:100%;
  min-height:106px;
  border:.5px solid rgba(60,60,67,.14);
  border-radius:20px;
  background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.045);
  padding:14px;
  display:grid;
  grid-template-columns:46px minmax(0,1fr) 22px;
  align-items:center;
  gap:12px;
  text-align:left;
  color:#1c1c1e
}

.resource-card:active{
  transform:scale(.988);
  background:#f7f7fa
}

.resource-icon{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:#eef6ff;
  color:#007aff
}

.resource-icon .ico{
  width:24px;
  height:24px
}

.resource-card.tone-green .resource-icon{
  background:#eaf8ee;
  color:#248a46
}

.resource-card.tone-amber .resource-icon{
  background:#fff5e4;
  color:#b96b00
}

.resource-card.tone-purple .resource-icon{
  background:#f5efff;
  color:#7d4db5
}

.resource-copy{
  min-width:0;
  display:grid;
  gap:4px
}

.resource-title{
  font-size:15px;
  font-weight:700;
  color:#111;
  letter-spacing:-.15px
}

.resource-body{
  font-size:12px;
  line-height:1.4;
  color:#6e6e73
}

.resource-meta{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-top:3px
}

.resource-tag{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  background:#f2f2f7;
  color:#6e6e73;
  padding:4px 7px;
  font-size:9px;
  font-weight:700
}

.resource-tag.program{
  background:#e8f2ff;
  color:#0067c7
}

.resource-open{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:#007aff;
  font-size:10px;
  font-weight:700;
  margin-top:2px
}

.resource-open .ico{
  width:13px;
  height:13px
}

.resource-chevron{
  color:#8e8e93
}

.resource-chevron .ico{
  width:20px;
  height:20px
}

.resources-note{
  background:#fff9eb;
  border:.5px solid rgba(255,159,10,.22);
  border-radius:15px;
  padding:11px 12px;
  color:#795400;
  font-size:11px;
  line-height:1.45
}

.resource-trust{
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  gap:10px;
  align-items:start
}

.resource-trust>.ico{
  width:24px;
  height:24px;
  color:#007aff;
  margin-top:1px
}

.resource-trust b{
  display:block;
  font-size:13px;
  margin-bottom:4px
}

.resource-trust p{
  margin:0;
  color:#6e6e73;
  font-size:11px;
  line-height:1.5
}

.money-pad-modal{max-height:min(620px,88dvh)}
.money-entry{cursor:pointer;text-align:right;font-variant-numeric:tabular-nums}
.money-entry[readonly]{opacity:1;-webkit-text-fill-color:var(--text)}
.money-entry:active{background:#e9e9ee}

.wic-benefit-details>summary{min-height:44px;padding:10px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;cursor:pointer;color:#007aff;font-size:11px;font-weight:650}
.wic-benefit-details>summary::-webkit-details-marker{display:none}
.wic-details-chevron{display:grid;place-items:center;transition:transform .18s ease}
.wic-details-chevron .ico{width:17px;height:17px}
.wic-benefit-details[open] .wic-details-chevron{transform:rotate(90deg)}
.wic-benefit-body{display:grid;gap:5px;padding-bottom:4px}

.legal-link-row:active{background:rgba(118,118,128,.08)}
.legal-danger-row b{color:var(--red)}
.legal-danger-row .ico{color:var(--red)}
